brary with GLIBCXX_3.4.32 is preloaded</text><rect x="780" y="22" width="340" height="320" rx="7" fill="white" stroke="#222222" stroke-width="1.2"/><rect x="780" y="22" width="340" height="30" rx="7" fill="#222222" stroke="#222222" stroke-width="1.0"/><rect x="780" y="38" width="340" height="14" rx="0" fill="#222222" stroke="#222222" stroke-width="1.0"/><text x="950.0" y="42.5" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="white" text-anchor="middle" xml:space="preserve">Backend</text><text x="950.0" y="363" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="normal" fill="#666666" text-anchor="middle" xml:space="preserve">--backend auto | trt | jax | torch</text><rect x="792" y="64" width="316" height="70" rx="4" fill="white" stroke="#0072B2" stroke-width="1.3"/><rect x="802" y="74" width="70" height="20" rx="3" fill="#0072B2" stroke="#0072B2" stroke-width="1.0"/><text x="837.0" y="88.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="bold" fill="white" text-anchor="middle" xml:space="preserve">TensorRT</text><text x="880" y="89" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">if an engine for this GPU covers</text><text x="802" y="109" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">the input; the smallest engine that fits</text><text x="802" y="126" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">is used (a 2048 engine before a 5120 one)</text><rect x="792" y="142" width="316" height="52" rx="4" fill="white" stroke="#222222" stroke-width="1.3"/><rect x="802" y="152" width="66" height="20" rx="3" fill="#222222" stroke="#222222" stroke-width="1.0"/><text x="835.0" y="166.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="bold" fill="white" text-anchor="middle" xml:space="preserve">PyTorch</text><text x="876" y="167" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">otherwise; the same weights, the</text><text x="802" y="187" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">same results, no engines needed</text><rect x="792" y="202" width="316" height="70" rx="4" fill="white" stroke="#009E73" stroke-width="1.3"/><rect x="802" y="212" width="42" height="20" rx="3" fill="#009E73" stroke="#009E73" stroke-width="1.0"/><text x="823.0" y="226.0" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="bold" fill="white" text-anchor="middle" xml:space="preserve">JAX</text><text x="852" y="227" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">on request: a Haiku port of the trunk</text><text x="802" y="247" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">and diffusion modules; Boltz-2 can run</text><text x="802" y="264" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">its diffusion on TensorRT in the same job</text><line x1="364" y1="182.0" x2="396" y2="182.0" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="butt" 