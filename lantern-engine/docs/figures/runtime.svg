 variables</text><rect x="32" y="556" width="316" height="44" rx="4" fill="#f3f3f3" stroke="#8a8a8a" stroke-width="1.0"/><text x="42" y="575" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">subprocess</text><text x="42" y="592" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#666666" text-anchor="start" xml:space="preserve">inside the runtime venv, cwd = core</text><rect x="32" y="608" width="316" height="44" rx="4" fill="white" stroke="#8a8a8a" stroke-width="1.0"/><text x="42" y="627" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">inference.log</text><text x="42" y="644" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#666666" text-anchor="start" xml:space="preserve">everything the model printed</text><rect x="400" y="410" width="340" height="270" rx="7" fill="white" stroke="#222222" stroke-width="1.2"/><rect x="400" y="410" width="340" height="30" rx="7" fill="#222222" stroke="#222222" stroke-width="1.0"/><rect x="400" y="426" width="340" height="14" rx="0" fill="#222222" stroke="#222222" stroke-width="1.0"/><text x="570.0" y="430.5" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="white" text-anchor="middle" xml:space="preserve">Result</text><text x="570.0" y="701" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="normal" fill="#666666" text-anchor="middle" xml:space="preserve">exit 3 if no sample was written</text><rect x="412" y="452" width="316" height="44" rx="4" fill="#f3f3f3" stroke="#8a8a8a" stroke-width="1.0"/><text x="422" y="471" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">post</text><text x="422" y="488" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#666666" text-anchor="start" xml:space="preserve">the model's own nesting → seed/sample layout</text><rect x="412" y="504" width="316" height="44" rx="4" fill="#f3f3f3" stroke="#8a8a8a" stroke-width="1.0"/><text x="422" y="523" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">verify</text><text x="422" y="540" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#666666" text-anchor="start" xml:space="preserve">layout and confidence files checked</text><rect x="412" y="556" width="316" height="44" rx="4" fill="white" stroke="#8a8a8a" stroke-width="1.0"/><text x="422" y="575" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">run.json</text><text x="422" y="592" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#666666" text-anchor="start" xml:space="preserve">command, environment, GPU, commit, wall time</text><rect x="780" y="410" width="340" height="270" rx="7" fill="white" stroke="#8a8a8a" stroke-width="1.0" stroke-dasharray="4 3"/><text x="796" y="440" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">The CLI is plain Python 3.11 with no</text><text x="796" y="461" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">dependencies. torch, JAX and TensorRT are</text><text x="796" y="482" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">imported only inside the subprocess, from</text><text x="796" y="503" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">the runtime venv.</text><text x="796" y="534" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">lantern-engine submit does the same through Slurm,</text><text x="796" y="555" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">one job per seed; the site file travels with</text><text x="796" y="576" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" xml:space="preserve">the job, so nothing is re-detected there.</text><path d="M 950.0 370 V 388.0 H 190.0 V 406" fill="none" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><line x1="364" y1="545.0" x2="396" y2="545.0" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="butt" marker-end="url(#arrow)"/></svg>