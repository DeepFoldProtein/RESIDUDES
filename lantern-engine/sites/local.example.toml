# Template for a new machine. `lantern-engine setup site --checkpoints DIR --engines DIR`
# writes sites/local.toml from it; or copy and edit by hand. Every key under
# [site] can also be overridden with LANTERN_ENGINE_<KEY> (e.g. LANTERN_ENGINE_ENGINES=/scratch/engines).
#
#   lantern-engine setup venv            # runtime venv at core/.venv (≈13 GB)
#   lantern-engine setup checkpoints     # model weights into `checkpoints`
#   lantern-engine engines build|pull    # TRT engines for this GPU (optional: --backend torch needs none)
#   lantern-engine doctor                # check everything
[site]
name = "local"
hosts = []                              # fnmatch patterns for auto-selection by hostname
scheduler = "none"                      # slurm | pueue | none
core = "{lantern_engine_root}/core"
venv = "{lantern_engine_root}/core/.venv"
checkpoints = "{lantern_engine_root}/data/checkpoints"   # protenix-v2.pt, of3-p2-155k.pt, boltz2/boltz2_conf.ckpt, af3/af3.bin
# venv_jax = "{lantern_engine_root}/core/jaxenv/.venv"    # JAX 0.11 environment (bash core/jaxenv/build.sh): needed for AlphaFold 3
# af3_weights = "/data/af3"                        # directory holding af3.bin, if not under checkpoints/af3
engines = "{lantern_engine_root}/data/engines"           # <gpu>/<model>_<kernel>_<maxN>/...
libstdcxx = []                          # extra LD_PRELOAD candidates; system / gcc-13 / conda paths are tried automatically
# kalign = "/usr/bin/kalign"
cache_dir = "{home}/.cache/lantern-engine"

[slurm]
partition = "gpu"
gres = "gpu:1"
cpus = 4
time = "02:00:00"
[slurm.constraint]

[jax]
dtype = "bf16"
mem_fraction = 0.65
venv = { pt2 = "venv", of3 = "venv", bt2 = "venv", af3 = "venv_jax" }
[jax.env]
LANTERN_ENGINE_JAX_TOKAMAX = "0"
LANTERN_ENGINE_JAX_CUEQ = "0"
