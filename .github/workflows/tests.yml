# Unit tests that need no GPU and no cluster: residudes (the agent: dossier, gates, checkpoints, harness layout)
# and residudes-engine (input building and run planning). residudes-qa needs its CUDA stack and is tested on the cluster.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 docs/check_links.py
      # the figures are written by hand, so a label that grew has nothing to catch it but this
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-urw-base35 fonts-dejavu-core
      - run: pip install --quiet pillow==11.3.0
      - run: python3 docs/svg_text_overlap.py $(git ls-files '*.svg')

  residudes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: residudes
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0     # no floating major tag: pin the release
        with:
          python-version: "3.12"
      - uses: typst-community/setup-typst@v5     # the deck test compiles a generated report
        with:
          typst-version: 0.13.1
      - run: uvx ruff@0.8.6 check src tests skills docs
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q

  residudes-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: residudes-engine
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0     # no floating major tag: pin the release
        with:
          python-version: "3.12"
      - run: uvx ruff@0.8.6 check src tests
      - run: uv run --no-project --with pytest==9.0.3 python -m pytest -q tests
        env:
          PYTHONPATH: src

  # The clustering suite needs no GPU and no torch: four pinned libraries and 72 s. The scorers and
  # their CUDA stack are still only testable on the cluster (tests/parity, run_tests.sbatch).
  residudes-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: residudes-qa
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0     # no floating major tag: pin the release
        with:
          python-version: "3.12"
      # the lockfile knows the dependencies; a list written out here would be a worse copy of it.
      # torch is an opt-in extra (cu130 / cu124), so a plain sync gives the CPU set and nothing more.
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q tests -p no:cacheprovider
