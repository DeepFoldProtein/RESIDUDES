# Build the images and publish them, so a cluster can pull instead of build.
#
# Each one is checked before it is pushed: the agent regenerates the H1388 example's analysis
# inside the image, the QA image runs its own 92 tests, the MSA image runs every binary it ships.
# An image that cannot do its job is not published.
#
# Only the three small images are built here. The GPU images were tried on hosted runners and do
# not fit: with the preinstalled toolchains deleted (41 GB free), with docker and buildkit moved
# to /mnt (41 GB), and with the wheel cache disabled, the TensorRT and JAX builds still ended in
# "no space left on device". They are built and pushed from a machine with the disk for them -
# see containers/publish-large.sh - and containers/verify.sh builds them locally when they are
# not in the registry.
#   - publishing needs main or a tag AND the repository variable PUBLISH_IMAGES=true. A package
#     on GHCR belongs to whichever repository first pushed it, and a second repository's
#     GITHUB_TOKEN is refused with "denied: permission_denied: read_package", which is what
#     happened when this file was mirrored to the public repository. So a repository publishes
#     only when someone has set that variable there and given it access to the packages;
#     everywhere else the images are built and checked, which is the part CI is for anyway.
#     A manual run on a branch likewise builds and checks without pushing
name: containers

on:
  push:
    branches: [main]
    paths:
      - "containers/**"
      - "residudes-qa/pyproject.toml"
      - "residudes-qa/uv.lock"
      - ".github/workflows/containers.yml"
    tags: ["v*"]
  pull_request:
    paths: ["containers/**", ".github/workflows/containers.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [residudes, residudes-qa, residudes-msa]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3.11.1

      - id: meta
        uses: docker/metadata-action@v5.9.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      # residudes-qa's recipe needs the lockfile that pins it, which lives outside containers/
      - name: assemble the build context
        run: |
          ctx="$RUNNER_TEMP/ctx"
          mkdir -p "$ctx"
          cp containers/${{ matrix.name }}/* "$ctx"/
          case "${{ matrix.name }}" in
            residudes-qa|residudes-qa-cu130)
              cp residudes-qa/pyproject.toml residudes-qa/uv.lock "$ctx"/ ;;
          esac
          echo "CTX=$ctx" >> "$GITHUB_ENV"

      - name: build
        uses: docker/build-push-action@v6.18.0
        with:
          context: ${{ env.CTX }}
          load: true
          tags: ${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # the image has to do its job before it gets a name anyone can pull
      - name: check — the agent reproduces the shipped example
        if: matrix.name == 'residudes'
        run: |
          mkdir -p work/targets && cp -r residudes/examples/H1388 work/targets/
          printf '[paths]\nwork_root = "/work"\n' > work/residudes.toml
          docker run --rm -v "$PWD/residudes:/opt/residudes" -v "$PWD/work:/work" residudes:ci \
              --config /work/residudes.toml report H1388 -o /work/out.md
          cmp work/out.md residudes/examples/H1388/analysis.md

      - name: check — the QA suite passes inside the image
        if: matrix.name == 'residudes-qa'
        run: |
          docker run --rm -v "$PWD/residudes-qa:/opt/residudes-qa" --entrypoint python residudes-qa:ci \
              -m pytest -q /opt/residudes-qa/tests -p no:cacheprovider

      - name: check — every MSA binary runs
        if: matrix.name == 'residudes-msa'
        run: |
          docker run --rm --entrypoint sh residudes-msa:ci -c \
              'for b in jackhmmer nhmmer hmmsearch hmmbuild hmmalign hmmscan kalign mmseqs; do "$b" -h >/dev/null 2>&1 || "$b" --help >/dev/null 2>&1 || exit 1; done'

      - name: log in to ghcr
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && vars.PUBLISH_IMAGES == 'true'
        uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: publish
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && vars.PUBLISH_IMAGES == 'true'
        uses: docker/build-push-action@v6.18.0
        with:
          context: ${{ env.CTX }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
