[project]
name = "residudes-qa"
version = "0.1.0"
description = "Model quality assessment for structure-prediction pools: XGBoost interface scorers, EMA physics/statistical terms, ProteinMPNN likelihood and GPU clustering (the DeepFold CASP17 QA stack)"
readme = "README.md"
requires-python = "==3.12.*"
authors = [{ name = "DeepFold team" }]
# Direct dependencies at the exact versions of the CASP17 production venv
# (/gpfs/deepfold/casp/casp17/analysis/.venv, frozen in envs/casp17-analysis-venv.freeze.txt).
dependencies = [
    "numpy==1.26.4",
    "pandas==3.0.2",
    "pyarrow==24.0.0",
    "scipy==1.17.1",
    "scikit-learn==1.8.0",
    "xgboost==3.2.0",
    "gemmi==0.7.5",
    "matplotlib==3.10.9",
    "seaborn==0.13.2",
    "umap-learn==0.5.12",
    "pynndescent==0.6.0",
    "numba==0.65.1",
    "scikit-fuzzy==0.5.0",
    # production venv had networkx 2.2, which conflicts with its own torch 2.11 (needs >= 2.5.1);
    # networkx is used only for the Louvain fallback when leidenalg is absent, so results are unaffected.
    "networkx==3.4.2",
    "leidenalg==0.11.0",
    "igraph==1.0.0",
    "tqdm==4.67.3",
    "biopython==1.87",
    "pot==0.9.6.post1",
    # residudes_qa.visualize (ex af3-viz container: click 8.3.3, gemmi 0.7.5, matplotlib 3.10.9, pandas 3.0.2;
    # the container had numpy 2.4.4 — plotting only, it runs on the QA numpy 1.26.4 pin)
    "click==8.3.3",
]

[project.optional-dependencies]
# Pick exactly one torch build: cu130 = CASP17 production (ada RTX4090/RTX6000, driver >= 580; B200),
# cu124 = nodes whose driver tops out at CUDA 12.4 (pop6).
# cu130 = the exact CASP17 production build: torch 2.11.0 from PyPI (CUDA 13.0 libraries) plus the
# CUDA python bindings / NCCL at the production versions (DFIRE sums differ at 1e-5 rel. otherwise).
# torch loads the CUDA runtime libraries from these wheels at import. They are pinned here
# because the extra has to be installable on a machine with no CUDA toolkit: without them
# `import torch` dies on libnvrtc.so / libcupti.so, which is what happens in a slim container.
cu130 = [
    "torch==2.11.0", "cuda-bindings==13.2.0", "cuda-pathfinder==1.5.4",
    "nvidia-nccl-cu12==2.30.4",
    "nvidia-cublas==13.1.0.3",
    "nvidia-cuda-cupti==13.0.85",
    "nvidia-cuda-nvrtc==13.0.88",
    "nvidia-cuda-runtime==13.0.96",
    "nvidia-cudnn-cu13==9.19.0.56",
    "nvidia-cufft==12.0.0.61",
    "nvidia-cufile==1.15.1.6",
    "nvidia-curand==10.4.0.35",
    "nvidia-cusolver==12.0.4.66",
    "nvidia-cusparse==12.6.3.3",
    "nvidia-cusparselt-cu13==0.8.0",
    "nvidia-nccl-cu13==2.28.9",
    "nvidia-nvjitlink==13.0.88",
    "nvidia-nvshmem-cu13==3.4.5",
    "nvidia-nvtx==13.0.85",
]
cu124 = ["torch==2.6.0"]

[dependency-groups]
dev = ["pytest==9.0.3"]

[project.scripts]
residudes-qa = "residudes_qa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/residudes_qa"]

[tool.uv]
conflicts = [[{ extra = "cu130" }, { extra = "cu124" }]]
# Transitive pins from the same production venv, so `uv lock` reproduces it rather than
# picking newer releases. torch / nvidia-* / triton come from the chosen torch extra.
constraint-dependencies = [
    "contourpy==1.3.3",
    "cycler==0.12.1",
    "fonttools==4.62.1",
    "joblib==1.5.3",
    "kiwisolver==1.5.0",
    "llvmlite==0.47.0",
    "packaging==26.2",
    "pillow==12.2.0",
    "pyparsing==3.3.2",
    "python-dateutil==2.9.0.post0",
    "six==1.17.0",
    "texttable==1.7.0",
    "threadpoolctl==3.6.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", extra = "cu124" },   # cu130: PyPI, as the production venv
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["src/residudes_qa/mpnn/run"]
