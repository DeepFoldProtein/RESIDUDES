# Example Ab-Ag mode configuration (e.g. H1335 layout).
# Used as documentation / hint sheet; the CLI does not currently parse YAML —
# pass the equivalent --flags to run_scoring.sh / `xgbdimer run-all`.
mode: ab

# CASP target directory + stoichiometry.
target_dir: /data/casp17/targets/H1335
sto: A1B1C1D1E1
# Optional whitelists; leave empty to scan everything on disk.
variants: []    # e.g. ['af3_msa', 'af3_selftmpl', 'af3_7lbe', 'af3_7lbe_mt']
methods:  []    # e.g. ['af3', 'bt2_jax', 'of3', 'pt2']

# Chain roles.
ab_chains: DE       # Fab heavy + light (full antibody chain set)
ag_chains: ABC      # Antigen chains (e.g. gO/gH/gL for H1335)
heavy:    E         # Single heavy chain (aADARS / chain-pair iPTM)
light:    D         # Single light chain
scfv:     null      # set when target is single-chain Fv

# Reference structure for COM alignment + regional RMSD.
ref_cif: /data/casp17/target_notes/H1335/structures/7LBE.cif
anchor_chains:     B           # gH on prediction (100%-identical anchor)
anchor_chains_ref: A           # gH on reference 7LBE
probe_chains:      A           # gO on prediction
probe_chains_ref:  C           # gO on reference 7LBE

# Strict-filter thresholds (override defaults if needed).
filter:
  aadars_frac_framework_max: 0.30
  aadars_frac_cdr_h3_min:    0.20
  iface_n_contacts_total_min: 100
  mpnn_iface_n_residues_min:  20
  n_chain_breaks_max:         0
  gO_core_max:                6.0     # gH-aligned gO regional RMSD ceiling
  no_clash_inter:             true
  max_intra_clash:            2
  no_of3:                     true    # OpenFold-3 is unreliable on Fab-Ag (H1335)

cluster:
  k_range: [2, 3, 4, 5, 6]
  random_state: 0

pick:
  n_top_xgb: 1
  n_final:   5

workers: 8
