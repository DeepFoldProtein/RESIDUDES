[project]
name = "residudes-engine"
version = "0.1.0"
description = "Run Protenix v2, OpenFold 3 and Boltz-2 from one input file, on PyTorch, TensorRT or JAX"
readme = "README.md"
requires-python = ">=3.11"
# residudes-engine itself is stdlib-only. The heavy runtime (torch, TensorRT, JAX,
# the model forks) lives in the site venv declared in sites/<site>.toml.
dependencies = []

[project.scripts]
residudes-engine = "residudes_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/residudes_engine"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# compact style on purpose: a; b on one line, small lambdas
ignore = ["E702", "E731", "E741"]
