# ada cluster (Slurm; RTX 4090 ×18 on ada/ada-00[1-3], RTX PRO 6000 ×6 on ada-004).
# Code and venv come from this checkout (`residudes-engine setup venv`); model weights
# and TRT engines are the shared CASP17 data on GPFS.
[site]
name = "ada"
hosts = ["ada", "ada-*"]
scheduler = "slurm"
core = "{residudes_engine_root}/core"
venv = "{residudes_engine_root}/core/.venv"
venv_jax = "{residudes_engine_root}/core/jaxenv/.venv"      # JAX 0.11 environment: AlphaFold 3 and the optional fused-kernel JAX backend
checkpoints = "/gpfs/deepfold/casp/casp17/checkpoints"
af3_weights = "/gpfs/database/af3"                 # af3.bin (licensed by Google DeepMind; not in checkpoints)
esm = "/gpfs/deepfold/casp/casp17/esm"             # ESMFold2: the esm checkout and its python 3.12 conda env
engines = "/gpfs/deepfold/casp/casp17/engines"
# libstdc++ carrying GLIBCXX_3.4.32 (needed by the C++ TensorRT plugin); system paths are tried after.
libstdcxx = ["/gpfs/deepfold/anaconda3/lib/libstdc++.so.6.0.33"]
kalign = "/gpfs/deepfold/others/kalign/bin/kalign"
cache_dir = "{home}/.cache/residudes-engine"

[msa]
af3_db_dir = "/gpfs/database/af3"                  # AlphaFold 3's own pipeline: --source af3 (jackhmmer, hours of CPU)

[slurm]
partition = "normal"
gres = "gpu:1"
cpus = 4
time = "02:00:00"
[slurm.constraint]          # --gpu <tag> → sbatch -C <value>
rtx4090 = "RTX4090"
rtx6000ada = "RTX6000"

[jax]
# JAX backend runs inside the main venv (XLA kernels). For tokamax fused kernels
# build the optional JAX venv (core/scripts/setup_jax_venv.sh), set venv_jax above
# and point models at it here, e.g. venv = { pt2 = "venv_jax" }.
dtype = "bf16"
mem_fraction = 0.65
venv = { pt2 = "venv", of3 = "venv", bt2 = "venv", af3 = "venv_jax" }
[jax.env]
RESIDUDES_ENGINE_JAX_TOKAMAX = "0"
RESIDUDES_ENGINE_JAX_CUEQ = "0"
RESIDUDES_ENGINE_JAX_PAIRFORMER_SCAN = "1"
RESIDUDES_ENGINE_JAX_TOKEN_TRANSFORMER_SCAN = "1"
