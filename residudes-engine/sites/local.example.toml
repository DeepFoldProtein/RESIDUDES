# Template for a new machine. `residudes-engine setup site --checkpoints DIR --engines DIR`
# writes sites/local.toml from it; or copy and edit by hand. Every key under
# [site] can also be overridden with RESIDUDES_ENGINE_<KEY> (e.g. RESIDUDES_ENGINE_ENGINES=/scratch/engines).
#
#   residudes-engine setup venv            # runtime venv at core/.venv (≈13 GB)
#   residudes-engine setup checkpoints     # model weights into `checkpoints`
#   residudes-engine engines build|pull    # TRT engines for this GPU (optional: --backend torch needs none)
#   residudes-engine doctor                # check everything
[site]
name = "local"
hosts = []                              # fnmatch patterns for auto-selection by hostname
scheduler = "none"                      # slurm | pueue | none
core = "{residudes_engine_root}/core"
venv = "{residudes_engine_root}/core/.venv"
checkpoints = "{residudes_engine_root}/data/checkpoints"   # protenix-v2.pt, of3-p2-155k.pt, boltz2/boltz2_conf.ckpt, af3/af3.bin
# venv_jax = "{residudes_engine_root}/core/jaxenv/.venv"    # JAX 0.11 environment (bash core/jaxenv/build.sh): needed for AlphaFold 3
# af3_weights = "/data/af3"                        # directory holding af3.bin, if not under checkpoints/af3
# esm = "/data/esm"                                # ESMFold2 (ef2): the esm checkout, whose .conda env runs it
# esm_python = "/data/esm/.conda/bin/python"       # that env's interpreter, if it is somewhere else
# esmfold2_weights = "/data/esmfold2_hf"           # HF cache for biohub/ESMFold2, if not under checkpoints
engines = "{residudes_engine_root}/data/engines"           # <gpu>/<model>_<kernel>_<maxN>/...
libstdcxx = []                          # extra LD_PRELOAD candidates; system / gcc-13 / conda paths are tried automatically
# kalign = "/usr/bin/kalign"
cache_dir = "{home}/.cache/residudes-engine"

# [msa]
# af3_db_dir = "/data/af3_databases"       # --source af3: AlphaFold 3's own jackhmmer/hmmsearch pipeline
# af3_container = "/data/af3.sif"          # run it with apptainer instead of the site's AF3 venv

[slurm]
partition = "gpu"
gres = "gpu:1"
cpus = 4
time = "02:00:00"
[slurm.constraint]

[jax]
dtype = "bf16"
mem_fraction = 0.65
venv = { pt2 = "venv", of3 = "venv", bt2 = "venv", af3 = "venv_jax" }
[jax.env]
RESIDUDES_ENGINE_JAX_TOKAMAX = "0"
RESIDUDES_ENGINE_JAX_CUEQ = "0"
