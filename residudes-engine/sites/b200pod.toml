# casp17-dev-port B200 pod (no Slurm; pueue). Clone this repo on the pod and run
# `residudes-engine setup venv`; put (or symlink) model weights and engines under /data/foldmux.
[site]
name = "b200pod"
hosts = ["casp17-dev-port*"]
scheduler = "pueue"
core = "{residudes_engine_root}/core"
venv = "{residudes_engine_root}/core/.venv"
venv_jax = "{residudes_engine_root}/core/.venv-jax"     # tokamax venv (core/scripts/setup_jax_venv.sh)
checkpoints = "/data/foldmux/checkpoints"
engines = "/data/foldmux/engines"
libstdcxx = ["/opt/conda/lib/libstdc++.so.6.0.33", "/opt/conda/lib/libstdc++.so.6"]
cache_dir = "/data/foldmux/cache"

[jax]
dtype = "bf16"
mem_fraction = 0.85
allocator = "vmm"
venv = { pt2 = "venv_jax", of3 = "venv_jax", bt2 = "venv_jax" }
[jax.env]
RESIDUDES_ENGINE_JAX_TOKAMAX = "1"
RESIDUDES_ENGINE_JAX_CUEQ = "1"
RESIDUDES_ENGINE_JAX_PAIRFORMER_SCAN = "1"
RESIDUDES_ENGINE_JAX_TOKEN_TRANSFORMER_SCAN = "1"
[jax.env.pt2]
RESIDUDES_ENGINE_JAX_ATTENTION_IMPL = "auto"
