[project]
# JAX-only environment for residudes-engine.
#
# Why a separate project file?
#   tokamax 0.0.12+ requires JAX >= 0.9.2, which in turn pulls numpy >= 2.0.
#   The main pyproject.toml pins numpy < 2 for the legacy torch + biotite +
#   cuequivariance stack used by the TRT path. Rather than bumping the main
#   project, we keep two completely separate uv-managed environments:
#
#     .venv      <- main pyproject.toml      (TRT path; numpy<2)
#     .venv-jax  <- pyproject-jax.toml (THIS) (JAX path; numpy>=2 + tokamax)
#
# Set up: `bash scripts/setup_jax_venv.sh`
# Activate: `source .venv-jax/bin/activate`
name = "residudes-engine-core-jax"
version = "0.1.0"
description = "JAX (+ tokamax) inference environment for residudes-engine models"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # --- JAX core (matched to tokamax 0.0.12 floor) ---
    "jax[cuda12]>=0.9.2",
    "dm-haiku>=0.0.16",
    "optax>=0.2.5",
    "chex>=0.1.91",
    # --- Tokamax: AF3-style fused kernels (Triton + Pallas + cuDNN) ---
    "tokamax>=0.0.12",
    # --- Torch host runtime (still needed for input embedder / sampler shell
    # in Protenix / Boltz-2 / OpenFold3). torch 2.6+ supports numpy 2. ---
    "torch>=2.6",
    "safetensors>=0.4",
    "einops>=0.8",
    "numpy>=2.0",
    # --- Protein structure data libs ---
    "biopython>=1.84",
    "biotite>=1.6.0",
    "modelcif>=1.2",
    "gemmi>=0.6.5",
    "pdbeccdutils>=0.8.5",
    "ml-collections>=1.1.0",
    "rdkit>=2026.3.1",
    "optree>=0.19.0",
    # --- Misc ---
    "pydantic>=2.11.0",
    "psutil>=5",
    "packaging>=24",
    "huggingface-hub>=1.9.0",
    "fair-esm>=2.0.0",
    "scikit-learn>=1.6.1",
    "pandas>=2.3.3",
    "nvtx>=0.2",
]

[project.optional-dependencies]
boltz = ["boltz>=2.2"]
openfold3 = ["openfold3"]

[tool.uv]
# Live alongside .venv (the main env) without colliding.
package = false
managed = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
openfold3 = { path = "models/openfold-3", editable = true }
