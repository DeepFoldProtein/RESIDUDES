[project]
name = "residudes-engine-core"
version = "0.1.0"
description = "TensorRT acceleration for protein structure prediction (Protenix, Boltz2, OpenFold3)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # torch with CUDA 12.8 (compatible with CUDA 13.x runtime)
    "torch>=2.6",
    # TRT pipeline — pinned: engines are locked to the exact major.minor
    # runtime they were built against.  Bumping this requires rebuilding
    # every .engine file under engines/ (see scripts/slurm/build_engine.sbatch).
    "tensorrt==10.16.1.11",
    "tensorrt-cu12==10.16.1.11",
    "tensorrt-cu12-libs==10.16.1.11",
    "tensorrt-cu12-bindings==10.16.1.11",
    "safetensors>=0.4",
    "nvtx>=0.2",
    "packaging>=24",
    "pydantic>=2.0",
    "psutil>=5",
    "numpy>=1.24,<2",
    "huggingface-hub>=1.9.0",
    "cuequivariance-torch>=0.9.1",
    "triton>=3.0",
    "einops>=0.8",
    # Protein structure tools
    "fair-esm>=2.0.0",
    "scikit-learn>=1.6.1",
    "biopython>=1.84",
    "biotite>=1.6.0",
    "modelcif>=1.2",
    "gemmi>=0.6.5",
    "pdbeccdutils>=0.8.5",
    "ml-collections>=1.1.0",
    "rdkit>=2026.3.1",
    "optree>=0.19.0",
    "nvidia-cublas>=13.3.0.5",
    "cuequivariance>=0.9.1",
    "cuequivariance-ops-cu13>=0.9.1",
    "cuequivariance-ops-torch-cu13>=0.9.1",
    "nvidia-cuda-nvrtc>=13.2.51",
    "pandas>=2.3.3",
]

[project.optional-dependencies]
# CUDA version-specific cuequivariance ops (pick ONE):
#   uv sync --extra cu12   # for CUDA 12.x
#   uv sync --extra cu13   # for CUDA 13.x (Blackwell B200)
cu12 = ["cuequivariance-ops-torch-cu12>=0.9.1"]
cu13 = ["cuequivariance-ops-torch-cu13>=0.9.1"]
boltz = ["boltz>=2.2"]
openfold3 = ["openfold3"]
# JAX hot-module backend — minimal, numpy<2-compatible (jax<0.9.1).
# Use this if you want JAX inside the same env as torch/biotite legacy stack.
# For tokamax (AF3-style fused kernels), use the *separate* JAX env at
# pyproject-jax.toml + .venv-jax instead — see scripts/setup_jax_venv.sh.
jax-cu13 = [
    "jax[cuda13]>=0.4.34,<0.9.1",
    "dm-haiku>=0.0.13",
    "optax>=0.2,<0.2.5",
    "chex>=0.1.86,<0.1.90",
]

[tool.uv]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
openfold3 = { path = "models/openfold-3", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["protenix", "boltz", "openfold3", "residudes_engine_jax"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
