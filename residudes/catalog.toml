# residudes catalog: what a campaign needs, where this machine keeps it, and how fresh it must be.
#
# Locations are written as {key} and filled from [databases] in residudes.toml, so one shared
# catalogue describes the components while each machine keeps its own layout. `residudes setup`
# asks for the ones it cannot find; a key with no value reports `unconfigured` and names itself.
# `residudes setup` / `residudes doctor` check every entry (stat only; no du/find on shared storage).
#   paths        all must exist
#   any_of       at least one must exist (alternatives)
#   date_file + date_regex + date_format   read a release date from a file; else the newest mtime of `paths`
#   max_age_days warn when older (0 = no freshness rule)
#   fix          what to do when missing or stale

[[component]]
name = "AF3 genetic databases"
kind = "database"
used_for = "af3_msa MSA search (jackhmmer)"
paths = [
  "{af3_db}/uniref90_2022_05.fa",
  "{af3_db}/mgy_clusters_2022_05.fa",
  "{af3_db}/bfd-first_non_consensus_sequences.fasta",
  "{af3_db}/uniprot_all_2021_04.fa",
  "{af3_db}/rfam_14_9_clust_seq_id_90_cov_80_rep_seq.fasta",
  "{af3_db}/rnacentral_active_seq_id_90_cov_80_linclust.fasta",
  "{af3_db}/nt_rna_2023_02_23_clust_seq_id_90_cov_80_rep_seq.fasta",
]
max_age_days = 0
fix = "link the shared copy; versions are fixed by AF3 (2021-2023 releases)"

[[component]]
name = "PDB mmCIF (templates)"
kind = "database"
used_for = "templates, exact-sequence sweep"
paths = ["{af3_db}/mmcif_files", "{af3_db}/recent_pdbs/pdb_seqres.txt"]
max_age_days = 60
fix = "weekly rsync from wwPDB (sbatch); a stale mirror hides recent structures"

[[component]]
name = "foldseek PDB"
kind = "database"
used_for = "structural homolog search, public-structure sweep"
paths = ["{foldseek_db}/pdb"]
date_file = "{foldseek_db}/pdb.version"
date_regex = "(\\d{6})\\s+PDB_DATE"
date_format = "%y%m%d"
max_age_days = 180
fix = "point the shared foldseek DB at a 2026 rebuild (CASP17 missed homologs on the 2024 DB)"

[[component]]
name = "foldseek PDB 2026 (newer copy)"
kind = "database"
used_for = "same as above, newer"
any_of = ["{foldseek_pdb_2026}"]      # [databases] foldseek_pdb_2026 in residudes.toml
max_age_days = 0
fix = "rebuild with `foldseek databases PDB` on a compute node, then set [databases] foldseek_pdb_2026"

[[component]]
name = "ColabFold databases"
kind = "database"
used_for = "mmseqs2 MSA (local / pop6 GPU API)"
paths = ["{colabfold_db}"]
max_age_days = 0
fix = "link the shared copy"

[[component]]
name = "AlphaFold 3 weights"
kind = "weights"
used_for = "af3 predictions"
any_of = ["{af3_db}/af3.bin", "{af3_db}/af3.bin.zst"]
max_age_days = 0
fix = "licensed per user by Google DeepMind: place af3.bin by hand"

[[component]]
name = "OpenStructure container"
kind = "tool"
used_for = "scoring against natives (retrospectives)"
paths = ["{containers}/openstructure.sif"]
max_age_days = 0
fix = "apptainer pull docker://registry.scicore.unibas.ch/schwede/openstructure"

[[component]]
name = "SAbDab"
kind = "database"
used_for = "antibody templates, CDR references"
paths = ["{sabdab}"]
max_age_days = 120
fix = "re-download the SAbDab summary + structures"
