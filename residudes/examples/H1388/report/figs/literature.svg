<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="849" viewBox="0 0 1400 849"><rect width="1400" height="849" fill="white"/><text x="40" y="58" font-family="DejaVu Sans, Helvetica, Arial" font-size="19" fill="#1d1d1f" text-anchor="start" font-weight="bold">5 claims recorded under `literature`, with the source each rests on</text><text x="894" y="58" font-family="DejaVu Sans, Helvetica, Arial" font-size="17" fill="#6e6e73" text-anchor="start" font-weight="normal">shares an identifier with</text><line x1="40.0" y1="76.0" x2="1360.0" y2="76.0" stroke="#d1d1d6" stroke-width="1.5"/><text x="44" y="110" font-family="DejaVu Sans, Helvetica, Arial" font-size="19" fill="#6e6e73" text-anchor="start" font-weight="bold">1</text><text x="84" y="110" font-family="DejaVu Sans, Helvetica, Arial" font-size="17" fill="#1d1d1f" text-anchor="start" font-weight="normal">14-3-3 proteins bind phosphoserine motifs; mode I consensus R-S-X-pS-X-P, mode II</text><text x="84" y="133" font-family="DejaVu Sans, Helvetica, Arial" font-size="17" fill="#1d1d1f" text-anchor="start" font-weight="normal">R-X-[Y/F]-X-pS-X-P; the phosphopeptide lies in the amphipathic groove of each</text><text x="84" y="156" font-family="DejaVu Sans, Helvetica, Arial" font-size="17" fill="#1d1d1f" text-anchor="start" font-weight="normal">monomer in extended conformation</text><text x="84" y="179" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#6e6e73" text-anchor="start" font-weight="normal">Yaffe et al. 1997 Cell, PMID 9428519</text><rect x="894.0" y="95.0" width="125.8" height="24.3" fill="#f2f2f7" rx="5"/><text x="902" y="114" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`binding_site`</text><rect x="1027.8" y="95.0" width="71.7" height="24.3" fill="#f2f2f7" rx="5"/><text x="1036" y="114" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`motif`</text><rect x="1107.5" y="95.0" width="107.6" height="24.3" fill="#f2f2f7" rx="5"/><text x="1115" y="114" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`chemistry`</text><rect x="894.0" y="123.0" width="212.5" height="24.3" fill="#f2f2f7" rx="5"/><text x="902" y="142" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`stoichiometry_evidence`</text><line x1="40.0" y1="203.0" x2="1360.0" y2="203.0" stroke="#ebebf0" stroke-width="1"/><text x="44" y="215" font-family="DejaVu Sans, Helvetica, Arial" font-size="19" fill="#6e6e73" text-anchor="start" font-weight="bold">2</text><text x="84" y="215" font-family="DejaVu Sans, Helvetica, Arial" font-size="17" fill="#1d1d1f" text-anchor="start" font-weight="normal">14-3-3 is a cup-shaped dimer; each monomer has its own peptide-binding groove; dimer</text><text x="84" y="238" font-family="DejaVu Sans, Helvetica, Arial" font-size="17" fill="#1d1d1f" text-anchor="start" font-weight="normal">interface formed by N-terminal helices</text><text x="84" y="261" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#6e6e73" text-anchor="start" font-weight="normal">Liu et al. 1995 Nature, PMID 7603574 (14-3-3 zeta crystal structure)</text><rect x="894.0" y="200.0" width="212.5" height="24.3" fill="#f2f2f7" rx="5"/><text x="902" y="219" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`stoichiometry_evidence`</text><line x1="40.0" y1="285.0" x2="1360.0" y2="285.0" stroke="#ebebf0" stroke-width="1"/><text x="44" y="297" font-family="DejaVu Sans, Helvetica, Arial" font-size="19" fill="#6e6e73" text-anchor="start" font-weight="bold">3</text><text x="84" y="297" font-family="DejaVu Sans, Helvetica, Arial" font-size="17" fill="#1d1d1f" text-anchor="start" font-weight="normal">The phosphate is coordinated by a conserved basic pocket: zeta K49, R56, R127, Y128</text><text x="84" y="320" font-family="DejaVu Sans, Helvetica, Arial" font-size="17" fill="#1d1d1f" text-anchor="start" font-weight="normal">-&gt; in 14-3-3 gamma native K50, R57, R132, Y133 = input chain B K49, R56, R131,</text><text x="84" y="343" font-family="DejaVu Sans, Helvetica, Arial" font-size="17" fill="#1d1d1f" text-anchor="start" font-weight="normal">Y132 (residue identities checked against FASTA)</text><text x="84" y="366" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#6e6e73" text-anchor="start" font-weight="normal">Yaffe 1997 PMID 9428519; many 14-3-3 gamma:phosphopeptide structures e.g. 2B05, 6A5S,</text><text x="84" y="386" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#6e6e73" text-anchor="start" font-weight="normal">6GKG</text><rect x="894.0" y="282.0" width="162.7" height="24.3" fill="#f2f2f7" rx="5"/><text x="902" y="301" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`public_structures`</text><rect x="1064.7" y="282.0" width="125.8" height="24.3" fill="#f2f2f7" rx="5"/><text x="1073" y="301" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`binding_site`</text><rect x="1198.5" y="282.0" width="71.7" height="24.3" fill="#f2f2f7" rx="5"/><text x="1206" y="301" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`motif`</text><rect x="894.0" y="310.0" width="107.6" height="24.3" fill="#f2f2f7" rx="5"/><text x="902" y="329" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`chemistry`</text><rect x="1009.6" y="310.0" width="212.5" height="24.3" fill="#f2f2f7" rx="5"/><text x="1018" y="329" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`stoichiometry_evidence`</text><rect x="1230.1" y="310.0" width="107.6" height="24.3" fill="#f2f2f7" rx="5"/><text x="1238" y="329" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`templates`</text><rect x="894.0" y="338.0" width="37.0" height="24.3" fill="#f2f2f7" rx="5"/><text x="902" y="357" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">D4</text><rect x="939.0" y="338.0" width="37.0" height="24.3" fill="#f2f2f7" rx="5"/><text x="947" y="357" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">D6</text><line x1="40.0" y1="410.0" x2="1360.0" y2="410.0" stroke="#ebebf0" stroke-width="1"/><text x="44" y="422" font-family="DejaVu Sans, Helvetica, Arial" font-size="19" fill="#6e6e73" text-anchor="start" font-weight="bold">4</text><text x="84" y="422" font-family="DejaVu Sans, Helvetica, Arial" font-size="17" fill="#1d1d1f" text-anchor="start" font-weight="normal">LARP1 S548 is an annotated phosphoserine (large-scale phosphoproteomics); peptide</text><text x="84" y="445" font-family="DejaVu Sans, Helvetica, Arial" font-size="17" fill="#1d1d1f" text-anchor="start" font-weight="normal">PKGLSApSLPDL fits pS-X-P (S548-L549-P550) with R/K upstream at -5 not -3 (G545</text><text x="84" y="468" font-family="DejaVu Sans, Helvetica, Arial" font-size="17" fill="#1d1d1f" text-anchor="start" font-weight="normal">at -3, L544 at -4); S546 (S-A-S) does not fit pS-X-P</text><text x="84" y="491" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#6e6e73" text-anchor="start" font-weight="normal">UniProt Q6PKG0 modified-residue feature; motif from PMID 9428519</text><rect x="894.0" y="407.0" width="102.8" height="24.3" fill="#f2f2f7" rx="5"/><text x="902" y="426" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`construct`</text><rect x="1004.9" y="407.0" width="89.8" height="24.3" fill="#f2f2f7" rx="5"/><text x="1013" y="426" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`identity`</text><rect x="1102.7" y="407.0" width="125.8" height="24.3" fill="#f2f2f7" rx="5"/><text x="1111" y="426" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`binding_site`</text><rect x="1236.5" y="407.0" width="71.7" height="24.3" fill="#f2f2f7" rx="5"/><text x="1244" y="426" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`motif`</text><rect x="894.0" y="435.0" width="107.6" height="24.3" fill="#f2f2f7" rx="5"/><text x="902" y="454" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`chemistry`</text><rect x="1009.6" y="435.0" width="212.5" height="24.3" fill="#f2f2f7" rx="5"/><text x="1018" y="454" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`stoichiometry_evidence`</text><line x1="40.0" y1="515.0" x2="1360.0" y2="515.0" stroke="#ebebf0" stroke-width="1"/><text x="44" y="527" font-family="DejaVu Sans, Helvetica, Arial" font-size="19" fill="#6e6e73" text-anchor="start" font-weight="bold">5</text><text x="84" y="527" font-family="DejaVu Sans, Helvetica, Arial" font-size="17" fill="#1d1d1f" text-anchor="start" font-weight="normal">LARP1 is an mTORC1 substrate controlling 5'TOP mRNA translation; recent cryo-EM</text><text x="84" y="550" font-family="DejaVu Sans, Helvetica, Arial" font-size="17" fill="#1d1d1f" text-anchor="start" font-weight="normal">9T76/9T77/9T7A/9T7B show LARP1 TOS/XTOS motif bound to mTORC1 (RAPTOR), a</text><text x="84" y="573" font-family="DejaVu Sans, Helvetica, Arial" font-size="17" fill="#1d1d1f" text-anchor="start" font-weight="normal">different region from 542-552</text><text x="84" y="596" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#6e6e73" text-anchor="start" font-weight="normal">RCSB 9T76-9T7B titles, 'mTORC1 recruits substrates via an expanded TOS (XTOS) motif' (2026)</text><rect x="894.0" y="512.0" width="162.7" height="24.3" fill="#f2f2f7" rx="5"/><text x="902" y="531" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`public_structures`</text><text x="40" y="636" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#6e6e73" text-anchor="start" font-weight="normal">A claim is linked to a prior or a decision when both name the same paper, structure, accession, residue or motif — never when they merely use the same word.</text><text x="40" y="667" font-family="DejaVu Sans, Helvetica, Arial" font-size="18" fill="#D55E00" text-anchor="start" font-weight="bold">Not settled by anything read</text><text x="44" y="693" font-family="DejaVu Sans, Helvetica, Arial" font-size="16" fill="#6e6e73" text-anchor="start" font-weight="normal">No paper or structure found on the 14-3-3:LARP1 complex itself (Europe PMC 'LARP1 14-3-3' 50 hits, none on the complex; one web search). The FASTA</text><text x="44" y="715" font-family="DejaVu Sans, Helvetica, Arial" font-size="16" fill="#6e6e73" text-anchor="start" font-weight="normal">names no modification; the CASP description text was not available to this step - if it says phosphopeptide, the pSer is S7. Whether one or two peptides bind the</text><text x="44" y="737" font-family="DejaVu Sans, Helvetica, Arial" font-size="16" fill="#6e6e73" text-anchor="start" font-weight="normal">14-3-3 dimer in the experiment is not known; given stoichiometry A1B1.</text><text x="40" y="775" font-family="DejaVu Sans, Helvetica, Arial" font-size="18" fill="#6e6e73" text-anchor="start" font-weight="bold">Searched</text><text x="44" y="801" font-family="DejaVu Sans, Helvetica, Arial" font-size="16" fill="#6e6e73" text-anchor="start" font-weight="normal">Europe PMC REST 2026-11-23; WebSearch; target_notes/H1388/papers does not exist</text></svg>