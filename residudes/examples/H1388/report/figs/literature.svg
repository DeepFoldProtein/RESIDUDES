<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="993" viewBox="0 0 1400 993"><rect width="1400" height="993" fill="white"/><text x="40" y="58" font-family="DejaVu Sans, Helvetica, Arial" font-size="19" fill="#1d1d1f" text-anchor="start" font-weight="bold">7 claims recorded under `literature`, with the source each rests on</text><text x="894" y="58" font-family="DejaVu Sans, Helvetica, Arial" font-size="17" fill="#6e6e73" text-anchor="start" font-weight="normal">shares an identifier with</text><line x1="40.0" y1="76.0" x2="1360.0" y2="76.0" stroke="#d1d1d6" stroke-width="1.5"/><text x="44" y="110" font-family="DejaVu Sans, Helvetica, Arial" font-size="19" fill="#6e6e73" text-anchor="start" font-weight="bold">1</text><text x="84" y="110" font-family="DejaVu Sans, Helvetica, Arial" font-size="17" fill="#1d1d1f" text-anchor="start" font-weight="normal">14-3-3 proteins bind phosphoserine-containing proteins through two motifs, RSXpSXP</text><text x="84" y="133" font-family="DejaVu Sans, Helvetica, Arial" font-size="17" fill="#1d1d1f" text-anchor="start" font-weight="normal">(mode 1) and RXY/FXpSXP (mode 2); the bound peptide is extended, with a tight turn at</text><text x="84" y="156" font-family="DejaVu Sans, Helvetica, Arial" font-size="17" fill="#1d1d1f" text-anchor="start" font-weight="normal">the pS+2 Pro (cis).</text><text x="84" y="179" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#6e6e73" text-anchor="start" font-weight="normal">Yaffe et al. 1997 Cell, PMID 9428519 (abstract read via Europe PMC)</text><rect x="894.0" y="95.0" width="125.8" height="24.3" fill="#f2f2f7" rx="5"/><text x="902" y="114" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`binding_site`</text><rect x="1027.8" y="95.0" width="107.6" height="24.3" fill="#f2f2f7" rx="5"/><text x="1036" y="114" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`chemistry`</text><rect x="1143.5" y="95.0" width="71.7" height="24.3" fill="#f2f2f7" rx="5"/><text x="1151" y="114" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`motif`</text><rect x="894.0" y="123.0" width="212.5" height="24.3" fill="#f2f2f7" rx="5"/><text x="902" y="142" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`stoichiometry_evidence`</text><rect x="1114.5" y="123.0" width="75.0" height="24.3" fill="#f2f2f7" rx="5"/><text x="1122" y="142" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`gates`</text><rect x="1197.5" y="123.0" width="37.0" height="24.3" fill="#f2f2f7" rx="5"/><text x="1205" y="142" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">D1</text><line x1="40.0" y1="203.0" x2="1360.0" y2="203.0" stroke="#ebebf0" stroke-width="1"/><text x="44" y="215" font-family="DejaVu Sans, Helvetica, Arial" font-size="19" fill="#6e6e73" text-anchor="start" font-weight="bold">2</text><text x="84" y="215" font-family="DejaVu Sans, Helvetica, Arial" font-size="17" fill="#1d1d1f" text-anchor="start" font-weight="normal">14-3-3 acts as a dimer; the dimer binds tandem phosphoserine motifs bidentately.</text><text x="84" y="238" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#6e6e73" text-anchor="start" font-weight="normal">PMID 9428519 (abstract)</text><rect x="894.0" y="200.0" width="125.8" height="24.3" fill="#f2f2f7" rx="5"/><text x="902" y="219" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`binding_site`</text><rect x="1027.8" y="200.0" width="107.6" height="24.3" fill="#f2f2f7" rx="5"/><text x="1036" y="219" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`chemistry`</text><rect x="1143.5" y="200.0" width="71.7" height="24.3" fill="#f2f2f7" rx="5"/><text x="1151" y="219" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`motif`</text><rect x="894.0" y="228.0" width="212.5" height="24.3" fill="#f2f2f7" rx="5"/><text x="902" y="247" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`stoichiometry_evidence`</text><rect x="1114.5" y="228.0" width="75.0" height="24.3" fill="#f2f2f7" rx="5"/><text x="1122" y="247" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`gates`</text><rect x="1197.5" y="228.0" width="37.0" height="24.3" fill="#f2f2f7" rx="5"/><text x="1205" y="247" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">D1</text><line x1="40.0" y1="273.0" x2="1360.0" y2="273.0" stroke="#ebebf0" stroke-width="1"/><text x="44" y="285" font-family="DejaVu Sans, Helvetica, Arial" font-size="19" fill="#6e6e73" text-anchor="start" font-weight="bold">3</text><text x="84" y="285" font-family="DejaVu Sans, Helvetica, Arial" font-size="17" fill="#1d1d1f" text-anchor="start" font-weight="normal">Structures of all seven human 14-3-3 isoforms bound to ligands; specificity determinants</text><text x="84" y="308" font-family="DejaVu Sans, Helvetica, Arial" font-size="17" fill="#1d1d1f" text-anchor="start" font-weight="normal">for phosphopeptide orientation in the amphipathic groove; domain flexibility.</text><text x="84" y="331" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#6e6e73" text-anchor="start" font-weight="normal">Yang et al. 2006 PNAS, PMID 17085597, PMC1859916 (abstract); the gamma entry from this work</text><text x="84" y="351" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#6e6e73" text-anchor="start" font-weight="normal">is 2B05 (inferred from release date and title, not checked)</text><rect x="894.0" y="270.0" width="162.7" height="24.3" fill="#f2f2f7" rx="5"/><text x="902" y="289" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`public_structures`</text><rect x="1064.7" y="270.0" width="212.5" height="24.3" fill="#f2f2f7" rx="5"/><text x="1073" y="289" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`stoichiometry_evidence`</text><line x1="40.0" y1="375.0" x2="1360.0" y2="375.0" stroke="#ebebf0" stroke-width="1"/><text x="44" y="387" font-family="DejaVu Sans, Helvetica, Arial" font-size="19" fill="#6e6e73" text-anchor="start" font-weight="bold">4</text><text x="84" y="387" font-family="DejaVu Sans, Helvetica, Arial" font-size="17" fill="#1d1d1f" text-anchor="start" font-weight="normal">14-3-3 gamma residues R57 and R132 (native numbering) interact with the</text><text x="84" y="410" font-family="DejaVu Sans, Helvetica, Arial" font-size="17" fill="#1d1d1f" text-anchor="start" font-weight="normal">phosphoserine of the bound protein (input R56, R131).</text><text x="84" y="433" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#6e6e73" text-anchor="start" font-weight="normal">UniProt P61981 Site features</text><rect x="894.0" y="372.0" width="89.8" height="24.3" fill="#f2f2f7" rx="5"/><text x="902" y="391" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`identity`</text><rect x="991.8" y="372.0" width="102.8" height="24.3" fill="#f2f2f7" rx="5"/><text x="1000" y="391" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`construct`</text><rect x="1102.6" y="372.0" width="125.8" height="24.3" fill="#f2f2f7" rx="5"/><text x="1111" y="391" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`binding_site`</text><rect x="1236.4" y="372.0" width="75.0" height="24.3" fill="#f2f2f7" rx="5"/><text x="1244" y="391" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`gates`</text><rect x="894.0" y="400.0" width="165.7" height="24.3" fill="#f2f2f7" rx="5"/><text x="902" y="419" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`gates_breakdown`</text><rect x="1067.7" y="400.0" width="37.0" height="24.3" fill="#f2f2f7" rx="5"/><text x="1076" y="419" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">D5</text><rect x="1112.7" y="400.0" width="37.0" height="24.3" fill="#f2f2f7" rx="5"/><text x="1121" y="419" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">D6</text><line x1="40.0" y1="457.0" x2="1360.0" y2="457.0" stroke="#ebebf0" stroke-width="1"/><text x="44" y="469" font-family="DejaVu Sans, Helvetica, Arial" font-size="19" fill="#6e6e73" text-anchor="start" font-weight="bold">5</text><text x="84" y="469" font-family="DejaVu Sans, Helvetica, Arial" font-size="17" fill="#1d1d1f" text-anchor="start" font-weight="normal">LARP1 Ser548 is a recorded phosphosite; it is residue 7 (S7) of chain A (LARP1</text><text x="84" y="492" font-family="DejaVu Sans, Helvetica, Arial" font-size="17" fill="#1d1d1f" text-anchor="start" font-weight="normal">542-552).</text><text x="84" y="515" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#6e6e73" text-anchor="start" font-weight="normal">UniProt Q6PKG0 Modified residue 548</text><rect x="894.0" y="454.0" width="89.8" height="24.3" fill="#f2f2f7" rx="5"/><text x="902" y="473" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`identity`</text><rect x="991.8" y="454.0" width="102.8" height="24.3" fill="#f2f2f7" rx="5"/><text x="1000" y="473" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`construct`</text><rect x="1102.6" y="454.0" width="107.6" height="24.3" fill="#f2f2f7" rx="5"/><text x="1111" y="473" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`chemistry`</text><rect x="1218.3" y="454.0" width="71.7" height="24.3" fill="#f2f2f7" rx="5"/><text x="1226" y="473" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`motif`</text><line x1="40.0" y1="539.0" x2="1360.0" y2="539.0" stroke="#ebebf0" stroke-width="1"/><text x="44" y="551" font-family="DejaVu Sans, Helvetica, Arial" font-size="19" fill="#6e6e73" text-anchor="start" font-weight="bold">6</text><text x="84" y="551" font-family="DejaVu Sans, Helvetica, Arial" font-size="17" fill="#1d1d1f" text-anchor="start" font-weight="normal">In the peptide PKGLSASLPDL only S7 is followed by X-Pro (S7-L8-P9), the pS-X-P</text><text x="84" y="574" font-family="DejaVu Sans, Helvetica, Arial" font-size="17" fill="#1d1d1f" text-anchor="start" font-weight="normal">core of both 14-3-3 motifs; S5 (S5-A6-S7) is not. No Arg at -3/-4 of S7 (L4, G3), so the</text><text x="84" y="597" font-family="DejaVu Sans, Helvetica, Arial" font-size="17" fill="#1d1d1f" text-anchor="start" font-weight="normal">peptide fits neither full consensus; K2 at -5.</text><text x="84" y="620" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#6e6e73" text-anchor="start" font-weight="normal">motif reading of PMID 9428519 against the FASTA, as counted here</text><rect x="894.0" y="536.0" width="102.8" height="24.3" fill="#f2f2f7" rx="5"/><text x="902" y="555" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`construct`</text><rect x="1004.9" y="536.0" width="125.8" height="24.3" fill="#f2f2f7" rx="5"/><text x="1013" y="555" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`binding_site`</text><rect x="1138.7" y="536.0" width="107.6" height="24.3" fill="#f2f2f7" rx="5"/><text x="1147" y="555" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`chemistry`</text><rect x="1254.3" y="536.0" width="71.7" height="24.3" fill="#f2f2f7" rx="5"/><text x="1262" y="555" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`motif`</text><rect x="894.0" y="564.0" width="212.5" height="24.3" fill="#f2f2f7" rx="5"/><text x="902" y="583" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`stoichiometry_evidence`</text><rect x="1114.5" y="564.0" width="115.7" height="24.3" fill="#f2f2f7" rx="5"/><text x="1122" y="583" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`msa_depth`</text><rect x="894.0" y="592.0" width="147.8" height="24.3" fill="#f2f2f7" rx="5"/><text x="902" y="611" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`peptide_analog`</text><rect x="1049.8" y="592.0" width="75.0" height="24.3" fill="#f2f2f7" rx="5"/><text x="1058" y="611" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`gates`</text><line x1="40.0" y1="644.0" x2="1360.0" y2="644.0" stroke="#ebebf0" stroke-width="1"/><text x="44" y="656" font-family="DejaVu Sans, Helvetica, Arial" font-size="19" fill="#6e6e73" text-anchor="start" font-weight="bold">7</text><text x="84" y="656" font-family="DejaVu Sans, Helvetica, Arial" font-size="17" fill="#1d1d1f" text-anchor="start" font-weight="normal">23 crystal/EM structures of human 14-3-3 gamma exist at 100% identity, most with</text><text x="84" y="679" font-family="DejaVu Sans, Helvetica, Arial" font-size="17" fill="#1d1d1f" text-anchor="start" font-weight="normal">bound phosphopeptides in the groove (e.g. 6S9K 1.60 A, 6ZBT 1.80 A, 6A5S 2.10 A).</text><text x="84" y="702" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#6e6e73" text-anchor="start" font-weight="normal">residudes structures H1388 (RCSB sequence search, 2026-11-26)</text><rect x="894.0" y="641.0" width="162.7" height="24.3" fill="#f2f2f7" rx="5"/><text x="902" y="660" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`public_structures`</text><rect x="1064.7" y="641.0" width="125.8" height="24.3" fill="#f2f2f7" rx="5"/><text x="1073" y="660" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`binding_site`</text><rect x="894.0" y="669.0" width="212.5" height="24.3" fill="#f2f2f7" rx="5"/><text x="902" y="688" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`stoichiometry_evidence`</text><rect x="1114.5" y="669.0" width="107.6" height="24.3" fill="#f2f2f7" rx="5"/><text x="1122" y="688" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`templates`</text><rect x="894.0" y="697.0" width="147.8" height="24.3" fill="#f2f2f7" rx="5"/><text x="902" y="716" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`peptide_analog`</text><rect x="1049.8" y="697.0" width="75.0" height="24.3" fill="#f2f2f7" rx="5"/><text x="1058" y="716" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">`gates`</text><rect x="1132.8" y="697.0" width="37.0" height="24.3" fill="#f2f2f7" rx="5"/><text x="1141" y="716" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#1d1d1f" text-anchor="start" font-weight="normal">D4</text><text x="40" y="758" font-family="DejaVu Sans, Helvetica, Arial" font-size="15" fill="#6e6e73" text-anchor="start" font-weight="normal">A claim is linked to a prior or a decision when both name the same paper, structure, accession, residue or motif — never when they merely use the same word.</text><text x="40" y="789" font-family="DejaVu Sans, Helvetica, Arial" font-size="18" fill="#D55E00" text-anchor="start" font-weight="bold">Not settled by anything read</text><text x="44" y="815" font-family="DejaVu Sans, Helvetica, Arial" font-size="16" fill="#6e6e73" text-anchor="start" font-weight="normal">["No paper on the 14-3-3:LARP1 pS548 interaction or its structure was found (Europe PMC: '\"LARP1\" AND \"14-3-3\"', 'LARP1 AND Ser548', 'LARP1 AND</text><text x="44" y="837" font-family="DejaVu Sans, Helvetica, Arial" font-size="16" fill="#6e6e73" text-anchor="start" font-weight="normal">(14-3-3 OR YWHA*)'); the organisers' description is not in the dossier, so whether the peptide was phosphorylated in the experiment is not confirmed here.",</text><text x="44" y="859" font-family="DejaVu Sans, Helvetica, Arial" font-size="16" fill="#6e6e73" text-anchor="start" font-weight="normal">"Which kinase phosphorylates LARP1 S548 was not read.", "No team PDFs: /data/casp17/target_notes/H1388/papers/ does not exist."]</text><text x="40" y="897" font-family="DejaVu Sans, Helvetica, Arial" font-size="18" fill="#6e6e73" text-anchor="start" font-weight="bold">Searched</text><text x="44" y="923" font-family="DejaVu Sans, Helvetica, Arial" font-size="16" fill="#6e6e73" text-anchor="start" font-weight="normal">["Europe PMC REST 2026-11-26: queries above + '14-3-3 AND phosphoserine AND motif AND RSXpSXP'", "UniProt P61981, Q6PKG0 JSON", "RCSB via</text><text x="44" y="945" font-family="DejaVu Sans, Helvetica, Arial" font-size="16" fill="#6e6e73" text-anchor="start" font-weight="normal">residudes structures"]</text></svg>