[project]
name = "residudes"
version = "0.1.0"
description = "A structure-prediction campaign agent: keeps a dossier per target, runs residudes-engine and residudes-qa, and uses Claude (Agent SDK) for the decisions between them"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "DeepFold team" }]
# Everything except the agent runner and the structure gates is stdlib, so `residudes setup` and `residudes doctor`
# work in any Python >= 3.11 before anything else is installed. The agent runner needs the Claude Agent SDK;
# `residudes gate` (and the chain check in `residudes review`) read structures with gemmi, imported only there.
dependencies = [
    "claude-agent-sdk==0.2.187",
    "gemmi==0.6.5",
    "numpy>=1.26,<3",             # the deck's MSA picture: identity per row, and Neff (pairwise, so not in pure Python)
]

[dependency-groups]
dev = ["pytest==9.0.3", "pytest-asyncio==1.3.0"]

[project.scripts]
residudes = "residudes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/residudes"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# compact style on purpose: a; b on one line, small lambdas, l for a row of links
ignore = ["E702", "E731", "E741"]
